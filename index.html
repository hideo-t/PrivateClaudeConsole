<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Private Claude Console</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-tertiary: #1a2235;
  --bg-input: #0d1220;
  --accent: #00d4aa;
  --accent-dim: #00d4aa22;
  --accent-glow: #00d4aa44;
  --text-primary: #e8edf5;
  --text-secondary: #8892a4;
  --text-muted: #4a5568;
  --border: #1e2a3a;
  --user-bg: #162032;
  --assistant-bg: #0f1622;
  --danger: #ff4757;
  --warning: #ffa502;
  --sidebar-width: 280px;
  --header-height: 56px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
}

/* Layout */
.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
  z-index: 100;
}

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-header .logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), #0088ff);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: #000;
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.sidebar-header .version {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

.new-chat-btn {
  margin: 12px 16px;
  padding: 10px 16px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  border-radius: 8px;
  color: var(--accent);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.new-chat-btn:hover {
  background: var(--accent-glow);
  box-shadow: 0 0 20px var(--accent-dim);
}

.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-track { background: transparent; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.history-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.15s;
}

.history-item:hover { background: var(--bg-tertiary); }
.history-item.active { background: var(--accent-dim); border: 1px solid var(--accent-glow); }

.history-item .title {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.history-item.active .title { color: var(--accent); }

.history-item .delete-btn {
  opacity: 0;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  font-size: 14px;
  transition: all 0.15s;
  flex-shrink: 0;
}

.history-item:hover .delete-btn { opacity: 1; }
.history-item .delete-btn:hover { color: var(--danger); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.api-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.api-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}

.api-status .dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.api-status .dot.error { background: var(--danger); }

/* Main area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Header */
.header {
  height: var(--header-height);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}

.model-selector {
  display: flex;
  gap: 4px;
  background: var(--bg-primary);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}

.model-btn {
  padding: 6px 14px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 6px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}

.model-btn.active {
  background: var(--accent);
  color: #000;
}

.model-btn:hover:not(.active) {
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.settings-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.2s;
}

.settings-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.token-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 8px;
  background: var(--bg-primary);
  border-radius: 4px;
}

/* Chat */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  scroll-behavior: smooth;
}

.chat-container::-webkit-scrollbar { width: 6px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.message {
  max-width: 800px;
  margin: 0 auto 16px;
  padding: 16px 20px;
  border-radius: 12px;
  animation: fadeIn 0.3s ease;
  line-height: 1.75;
  font-size: 14.5px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  background: var(--user-bg);
  border: 1px solid var(--border);
}

.message.assistant {
  background: var(--assistant-bg);
  border-left: 3px solid var(--accent);
}

.message .role-label {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  color: var(--text-muted);
}

.message.assistant .role-label { color: var(--accent); }

.message .content { white-space: pre-wrap; word-break: break-word; }

.message .content code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-primary);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

.message .content pre {
  background: var(--bg-primary);
  padding: 12px 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid var(--border);
}

.message .content pre code {
  background: none;
  padding: 0;
}

.message .attachments {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.message .attachment-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}

.message .attachment-thumb {
  max-width: 200px;
  max-height: 150px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 8px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1); }
}

.welcome {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
  padding-top: 15vh;
}

.welcome h2 {
  font-size: 24px;
  font-weight: 300;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.welcome p {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
}

.welcome .accent { color: var(--accent); }

/* Input area */
.input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.input-wrapper {
  max-width: 800px;
  margin: 0 auto;
}

.file-preview {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  animation: fadeIn 0.2s;
}

.file-chip img {
  width: 32px;
  height: 32px;
  object-fit: cover;
  border-radius: 4px;
}

.file-chip .remove {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
}

.file-chip .remove:hover { color: var(--danger); }

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
  transition: border-color 0.2s;
}

.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.input-box textarea {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  outline: none;
  max-height: 150px;
  min-height: 24px;
}

.input-box textarea::placeholder { color: var(--text-muted); }

.input-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  align-items: flex-end;
}

.icon-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 8px;
  font-size: 18px;
  transition: all 0.2s;
}

.icon-btn:hover { color: var(--text-primary); background: var(--bg-tertiary); }

.send-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  border: none;
  color: #000;
  cursor: pointer;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  transition: all 0.2s;
}

.send-btn:hover { box-shadow: 0 0 16px var(--accent-glow); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

.stop-btn {
  background: var(--danger);
}

/* Settings Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s;
}

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 90%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal h3 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 20px;
  color: var(--text-primary);
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--accent);
}

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.form-group .hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.btn {
  padding: 8px 20px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
}

.btn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 500;
}

.btn-primary:hover { box-shadow: 0 0 16px var(--accent-dim); }

.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
}

.btn-secondary:hover { background: var(--bg-tertiary); }

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}

.btn-danger:hover { background: rgba(255, 71, 87, 0.1); }

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }

  .sidebar.open { transform: translateX(0); }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    display: none;
  }

  .sidebar-overlay.show { display: block; }
  .menu-toggle { display: block; }

  .model-btn { padding: 6px 10px; font-size: 11px; }
  .message { padding: 12px 16px; }
  .chat-container { padding: 12px; }
}

/* Error message */
.error-msg {
  max-width: 800px;
  margin: 0 auto 16px;
  padding: 12px 16px;
  background: rgba(255, 71, 87, 0.1);
  border: 1px solid rgba(255, 71, 87, 0.3);
  border-radius: 8px;
  color: var(--danger);
  font-size: 13px;
  animation: fadeIn 0.3s;
}

/* System prompt indicator */
.system-prompt-indicator {
  font-size: 11px;
  color: var(--text-muted);
  padding: 2px 8px;
  background: var(--bg-primary);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.system-prompt-indicator.active { color: var(--accent); }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">PC</div>
      <div>
        <h1>Private Console</h1>
        <div class="version">Claude API Client v1.0</div>
      </div>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
      <span>＋</span> 新しいチャット
    </button>

    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">
      <div class="api-status" id="apiStatus">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">APIキー未設定</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <!-- Header -->
    <header class="header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

      <div class="model-selector" id="modelSelector">
        <button class="model-btn active" data-model="claude-opus-4-6" onclick="selectModel(this)">Opus</button>
        <button class="model-btn" data-model="claude-sonnet-4-5-20250929" onclick="selectModel(this)">Sonnet</button>
        <button class="model-btn" data-model="claude-haiku-4-5-20251001" onclick="selectModel(this)">Haiku</button>
      </div>

      <div class="header-right">
        <span class="system-prompt-indicator" id="sysPromptIndicator">
          📋 System
        </span>
        <span class="token-count" id="tokenCount"></span>
        <button class="settings-btn" onclick="openSettings()">⚙ 設定</button>
      </div>
    </header>

    <!-- Chat -->
    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcome">
        <h2>Private <span class="accent">Claude</span> Console</h2>
        <p>claude.aiに依存しない、あなた専用のインターフェース。<br>
        APIキーを設定して、安定した接続を。</p>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrapper">
        <div class="file-preview" id="filePreview"></div>
        <div class="input-box">
          <textarea id="userInput" placeholder="メッセージを入力... (Shift+Enterで改行)" rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <div class="input-actions">
            <input type="file" id="fileInput" multiple accept="image/*,.pdf" style="display:none" onchange="handleFiles(event)">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="ファイル添付">📎</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="送信">▶</button>
          </div>
        </div>
      </div>
    </div>
  <!-- Debug Log -->
  <div id="debugPanel" style="position:fixed;bottom:0;right:0;width:400px;max-height:200px;overflow-y:auto;background:#000;border:1px solid #333;font-family:'JetBrains Mono',monospace;font-size:11px;color:#0f0;padding:8px;z-index:999;display:block;">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
      <span style="color:#ff0;">📋 Debug Log</span>
      <button onclick="document.getElementById('debugPanel').style.display='none'" style="background:none;border:none;color:#666;cursor:pointer;">✕</button>
    </div>
    <div id="debugLog"></div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal" style="display:none" onclick="event.target===this && closeSettings()">
  <div class="modal">
    <h3>⚙ 設定</h3>

    <div class="form-group">
      <label>API キー</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-...">
      <div class="hint">Anthropic APIキーを入力。ブラウザのローカルストレージに保存されます。</div>
    </div>

    <div class="form-group">
      <label>System Prompt</label>
      <textarea id="systemPromptInput" placeholder="（任意）AIの振る舞いを指定するシステムプロンプト"></textarea>
      <div class="hint">全会話に適用されるシステムプロンプト。空白可。</div>
    </div>

    <div class="form-group">
      <label>Max Tokens</label>
      <input type="number" id="maxTokensInput" value="4096" min="256" max="128000">
    </div>

    <div class="form-group">
      <label>Temperature</label>
      <input type="number" id="temperatureInput" value="1" min="0" max="1" step="0.1">
    </div>

    <div class="form-group">
      <label>ストリーミング</label>
      <select id="streamingInput">
        <option value="false">OFF（安定モード）</option>
        <option value="true">ON（リアルタイム表示）</option>
      </select>
      <div class="hint">応答が返らない場合はOFFにしてください。</div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" onclick="clearAllHistory()">全履歴削除</button>
      <button class="btn btn-secondary" onclick="testApiConnection()" id="testBtn">🔌 接続テスト</button>
      <span style="flex:1"></span>
      <button class="btn btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
    <div id="testResult" style="margin-top:12px;font-size:13px;display:none;padding:10px;border-radius:8px;"></div>
  </div>
</div>

<script>
// ===================== Debug =====================
function debugLog(msg, type = 'info') {
  const colors = { info: '#0f0', error: '#f44', warn: '#ff0', data: '#0af' };
  const el = document.getElementById('debugLog');
  if (!el) return;
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div style="color:${colors[type] || '#0f0'};margin:1px 0;">[${time}] ${msg}</div>`;
  el.parentElement.scrollTop = el.parentElement.scrollHeight;
  console.log(`[PCC ${type}]`, msg);
}

// ===================== State =====================
let state = {
  apiKey: '',
  model: 'claude-opus-4-6',
  systemPrompt: '',
  maxTokens: 4096,
  temperature: 1,
  conversations: {},
  currentConvId: null,
  isStreaming: false,
  abortController: null,
  streaming: false,
  pendingFiles: []
};

const MODEL_LABELS = {
  'claude-opus-4-6': 'Opus 4.6',
  'claude-sonnet-4-5-20250929': 'Sonnet 4.5',
  'claude-haiku-4-5-20251001': 'Haiku 4.5'
};

// ===================== Init =====================
function init() {
  loadState();
  debugLog('Private Claude Console v1.1 initialized');
  debugLog('API key: ' + (state.apiKey ? state.apiKey.substring(0, 10) + '...' : 'NOT SET'), state.apiKey ? 'info' : 'warn');
  debugLog('Model: ' + state.model);
  debugLog('Streaming: ' + state.streaming);
  renderHistory();
  updateApiStatus();
  updateSysPromptIndicator();

  if (state.currentConvId && state.conversations[state.currentConvId]) {
    renderMessages();
  }

  document.getElementById('userInput').focus();
}

function loadState() {
  try {
    const saved = localStorage.getItem('pcc_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed, isStreaming: false, abortController: null, pendingFiles: [] };
    }
  } catch(e) { console.error('Load error:', e); }
}

function saveState() {
  try {
    const toSave = { ...state };
    delete toSave.isStreaming;
    delete toSave.abortController;
    delete toSave.pendingFiles;
    localStorage.setItem('pcc_state', JSON.stringify(toSave));
  } catch(e) { console.error('Save error:', e); }
}

// ===================== Model Selection =====================
function selectModel(btn) {
  document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.model = btn.dataset.model;
  saveState();
}

// ===================== Sidebar =====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const convs = Object.entries(state.conversations)
    .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

  list.innerHTML = convs.map(([id, conv]) => `
    <div class="history-item ${id === state.currentConvId ? 'active' : ''}" onclick="loadConversation('${id}')">
      <span class="title">${escapeHtml(conv.title || '新しいチャット')}</span>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${id}')" title="削除">✕</button>
    </div>
  `).join('');
}

// ===================== Conversations =====================
function newChat() {
  const id = 'conv_' + Date.now();
  state.conversations[id] = {
    title: '新しいチャット',
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  state.currentConvId = id;
  state.pendingFiles = [];
  saveState();
  renderHistory();
  renderMessages();
  document.getElementById('filePreview').innerHTML = '';
  document.getElementById('userInput').focus();
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function loadConversation(id) {
  state.currentConvId = id;
  state.pendingFiles = [];
  saveState();
  renderHistory();
  renderMessages();
  document.getElementById('filePreview').innerHTML = '';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function deleteConversation(id) {
  if (!confirm('この会話を削除しますか？')) return;
  delete state.conversations[id];
  if (state.currentConvId === id) {
    state.currentConvId = null;
  }
  saveState();
  renderHistory();
  renderMessages();
}

function clearAllHistory() {
  if (!confirm('全ての会話履歴を削除しますか？この操作は取り消せません。')) return;
  state.conversations = {};
  state.currentConvId = null;
  saveState();
  renderHistory();
  renderMessages();
  closeSettings();
}

// ===================== Messages =====================
function renderMessages() {
  const container = document.getElementById('chatContainer');
  const welcome = document.getElementById('welcome');

  if (!state.currentConvId || !state.conversations[state.currentConvId]) {
    container.innerHTML = '';
    container.appendChild(welcome);
    welcome.style.display = 'block';
    document.getElementById('tokenCount').textContent = '';
    return;
  }

  welcome.style.display = 'none';
  const conv = state.conversations[state.currentConvId];
  let html = '';

  for (const msg of conv.messages) {
    html += renderMessage(msg);
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
  updateTokenCount();
}

function renderMessage(msg) {
  const roleLabel = msg.role === 'user' ? 'あなた' : MODEL_LABELS[msg.model] || 'Claude';
  let attachmentsHtml = '';

  if (msg.attachments && msg.attachments.length > 0) {
    const badges = msg.attachments.map(a => {
      if (a.type === 'image') {
        return `<img class="attachment-thumb" src="${a.preview}" alt="${escapeHtml(a.name)}">`;
      }
      return `<span class="attachment-badge">📄 ${escapeHtml(a.name)}</span>`;
    }).join('');
    attachmentsHtml = `<div class="attachments">${badges}</div>`;
  }

  const content = typeof msg.content === 'string' ? msg.content :
    msg.content.filter(b => b.type === 'text').map(b => b.text).join('\n');

  return `
    <div class="message ${msg.role}">
      <div class="role-label">${roleLabel}</div>
      ${attachmentsHtml}
      <div class="content">${formatContent(content)}</div>
    </div>
  `;
}

function formatContent(text) {
  // Basic code block formatting
  text = escapeHtml(text);
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  return text;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===================== File Handling =====================
function handleFiles(event) {
  const files = Array.from(event.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const base64 = e.target.result.split(',')[1];
      const mediaType = file.type || 'application/octet-stream';
      const isImage = file.type.startsWith('image/');
      const isPdf = file.type === 'application/pdf';

      state.pendingFiles.push({
        name: file.name,
        type: isImage ? 'image' : (isPdf ? 'document' : 'unknown'),
        mediaType: mediaType,
        base64: base64,
        preview: isImage ? e.target.result : null
      });

      renderFilePreview();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function renderFilePreview() {
  const container = document.getElementById('filePreview');
  container.innerHTML = state.pendingFiles.map((f, i) => `
    <div class="file-chip">
      ${f.preview ? `<img src="${f.preview}" alt="">` : '📄'}
      <span>${escapeHtml(f.name)}</span>
      <button class="remove" onclick="removeFile(${i})">✕</button>
    </div>
  `).join('');
}

function removeFile(index) {
  state.pendingFiles.splice(index, 1);
  renderFilePreview();
}

// ===================== Send Message =====================
async function sendMessage() {
  debugLog('sendMessage() called');

  if (state.isStreaming) {
    debugLog('Currently streaming, aborting...');
    if (state.abortController) {
      state.abortController.abort();
    }
    return;
  }

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  debugLog('Input text: "' + text.substring(0, 50) + '"');
  debugLog('Pending files: ' + state.pendingFiles.length);

  if (!text && state.pendingFiles.length === 0) {
    debugLog('Empty input, returning', 'warn');
    return;
  }

  if (!state.apiKey) {
    debugLog('No API key set', 'error');
    openSettings();
    return;
  }

  debugLog('API key: ' + state.apiKey.substring(0, 10) + '...');
  debugLog('Model: ' + state.model);
  debugLog('Streaming: ' + state.streaming);

  try {

  // Create conversation if needed
  if (!state.currentConvId) {
    debugLog('No current conversation, creating new...');
    newChat();
  }

  debugLog('Current conv ID: ' + state.currentConvId);
  const conv = state.conversations[state.currentConvId];
  debugLog('Conv exists: ' + !!conv);

  if (!conv) {
    debugLog('ERROR: conv is null/undefined!', 'error');
    return;
  }

  // Build user message content
  let content = [];
  const attachments = [];

  state.pendingFiles.forEach(f => {
    if (f.type === 'image') {
      content.push({
        type: 'image',
        source: { type: 'base64', media_type: f.mediaType, data: f.base64 }
      });
      attachments.push({ type: 'image', name: f.name, preview: f.preview });
    } else if (f.type === 'document') {
      content.push({
        type: 'document',
        source: { type: 'base64', media_type: f.mediaType, data: f.base64 }
      });
      attachments.push({ type: 'document', name: f.name });
    }
  });

  if (text) {
    content.push({ type: 'text', text: text });
  }

  debugLog('Content blocks: ' + content.length);

  const userMsg = {
    role: 'user',
    content: content.length === 1 && content[0].type === 'text' ? text : content,
    attachments: attachments.length > 0 ? attachments : undefined
  };

  conv.messages.push(userMsg);
  debugLog('User message pushed. Total messages: ' + conv.messages.length);

  // Auto-title
  if (conv.messages.length === 1 && text) {
    conv.title = text.substring(0, 40) + (text.length > 40 ? '...' : '');
  }

  conv.updatedAt = Date.now();
  state.pendingFiles = [];
  input.value = '';
  autoResize(input);
  document.getElementById('filePreview').innerHTML = '';

  renderHistory();
  renderMessages();

  // Start API call
  debugLog('Calling streamResponse()...');
  await streamResponse(conv);
  debugLog('sendMessage() complete');

  } catch (e) {
    debugLog('UNCAUGHT ERROR in sendMessage: ' + e.message, 'error');
    debugLog('Stack: ' + e.stack, 'error');
  }
}

async function streamResponse(conv) {
  debugLog('streamResponse() called');
  state.isStreaming = true;
  state.abortController = new AbortController();
  updateSendButton();

  const container = document.getElementById('chatContainer');
  debugLog('Message count in conv: ' + conv.messages.length);

  // Add typing indicator
  const typingDiv = document.createElement('div');
  typingDiv.className = 'message assistant';
  typingDiv.innerHTML = `
    <div class="role-label">${MODEL_LABELS[state.model] || 'Claude'}</div>
    <div class="content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
  `;
  container.appendChild(typingDiv);
  container.scrollTop = container.scrollHeight;

  // Build API messages (strip attachments/preview data for API)
  const apiMessages = conv.messages.map(m => ({
    role: m.role,
    content: m.content
  }));

  debugLog('API messages built: ' + apiMessages.length);
  apiMessages.forEach((m, i) => {
    const preview = typeof m.content === 'string' ? m.content.substring(0, 30) : '[array: ' + m.content.length + ' blocks]';
    debugLog('  msg[' + i + '] ' + m.role + ': ' + preview, 'data');
  });

  const body = {
    model: state.model,
    max_tokens: state.maxTokens,
    temperature: state.temperature,
    messages: apiMessages,
    stream: state.streaming
  };

  if (state.systemPrompt) {
    body.system = state.systemPrompt;
  }

  try {
    console.log('[PCC] Sending request...', { model: state.model, streaming: state.streaming, messageCount: apiMessages.length });
    debugLog('Sending fetch to API...');
    debugLog('Body: stream=' + body.stream + ', model=' + body.model + ', max_tokens=' + body.max_tokens);

    let response;
    try {
      response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': state.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body),
        signal: state.abortController.signal
      });
    } catch (fetchErr) {
      console.error('[PCC] Fetch failed:', fetchErr);
      debugLog('FETCH FAILED: ' + fetchErr.message, 'error');
      throw new Error('ネットワークエラー: APIに接続できません。\n詳細: ' + fetchErr.message);
    }

    console.log('[PCC] Response status:', response.status, response.statusText);
    debugLog('Response: ' + response.status + ' ' + response.statusText, response.ok ? 'info' : 'error');

    if (!response.ok) {
      let errMsg = `API Error: ${response.status} ${response.statusText}`;
      try {
        const errBody = await response.text();
        console.error('[PCC] Error body:', errBody);
        const errJson = JSON.parse(errBody);
        if (errJson.error?.message) errMsg = errJson.error.message;
      } catch(e) {}

      if (response.status === 401) throw new Error('APIキーが無効です。設定を確認してください。');
      if (response.status === 400) throw new Error('リクエストエラー: ' + errMsg);
      if (response.status === 429) throw new Error('レート制限に達しました。少し待ってください。');
      if (response.status === 529) throw new Error('API過負荷中。しばらくお待ちください。');
      throw new Error(errMsg);
    }

    let assistantText = '';

    if (!state.streaming) {
      // ===== Non-streaming mode =====
      debugLog('Parsing JSON response (non-streaming)...');
      const data = await response.json();
      debugLog('Response content blocks: ' + (data.content?.length || 0), 'data');
      debugLog('Stop reason: ' + (data.stop_reason || 'none'), 'data');
      console.log('[PCC] Response data:', data);

      assistantText = data.content
        ?.filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n') || '';

      typingDiv.querySelector('.content').innerHTML = formatContent(assistantText);
      container.scrollTop = container.scrollHeight;

    } else {
      // ===== Streaming mode =====
      if (!response.body) {
        throw new Error('ストリーミング未対応のブラウザです。設定でストリーミングをOFFにしてください。');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);

              if (parsed.type === 'content_block_delta' && parsed.delta?.type === 'text_delta') {
                assistantText += parsed.delta.text;
                typingDiv.querySelector('.content').innerHTML = formatContent(assistantText);
                container.scrollTop = container.scrollHeight;
              }

              if (parsed.type === 'message_stop') break;

              if (parsed.type === 'error') {
                console.error('[PCC] Stream error:', parsed.error);
                throw new Error(parsed.error?.message || 'ストリーミングエラー');
              }
            } catch (e) {
              if (e.message.includes('エラー') || e.message.includes('API')) throw e;
              continue;
            }
          }
        }
      }
    }

    console.log('[PCC] Complete. Response length:', assistantText.length);
    debugLog('Response text length: ' + assistantText.length, 'info');

    if (assistantText) {
      debugLog('Saving assistant message...', 'info');
      conv.messages.push({
        role: 'assistant',
        content: assistantText,
        model: state.model
      });
      conv.updatedAt = Date.now();
      saveState();
      renderHistory();
    } else {
      throw new Error('AIからの応答が空でした。');
    }

  } catch (error) {
    console.error('[PCC] Error:', error);
    debugLog('ERROR: ' + error.message, 'error');
    debugLog('Error name: ' + error.name, 'error');

    if (error.name === 'AbortError') {
      const partialText = typingDiv.querySelector('.content')?.textContent || '';
      if (partialText) {
        conv.messages.push({ role: 'assistant', content: partialText, model: state.model });
        conv.updatedAt = Date.now();
        saveState();
      }
    } else {
      if (typingDiv.parentNode) container.removeChild(typingDiv);
      const errDiv = document.createElement('div');
      errDiv.className = 'error-msg';
      errDiv.innerHTML = '⚠ ' + escapeHtml(error.message).replace(/\n/g, '<br>');
      container.appendChild(errDiv);
      container.scrollTop = container.scrollHeight;

      if (error.message.includes('APIキーが無効')) updateApiStatus(false);
    }
  }

  state.isStreaming = false;
  state.abortController = null;
  updateSendButton();
  debugLog('streamResponse() finished', 'info');
  renderMessages();
}

// ===================== UI Helpers =====================
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function updateSendButton() {
  const btn = document.getElementById('sendBtn');
  if (state.isStreaming) {
    btn.innerHTML = '■';
    btn.classList.add('stop-btn');
    btn.title = '停止';
  } else {
    btn.innerHTML = '▶';
    btn.classList.remove('stop-btn');
    btn.title = '送信';
  }
}

function updateApiStatus(forceError) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');

  if (forceError === false) {
    dot.className = 'dot error';
    text.textContent = 'APIキーエラー';
  } else if (state.apiKey) {
    dot.className = 'dot connected';
    text.textContent = 'API接続済み';
  } else {
    dot.className = 'dot';
    text.textContent = 'APIキー未設定';
  }
}

function updateSysPromptIndicator() {
  const indicator = document.getElementById('sysPromptIndicator');
  if (state.systemPrompt) {
    indicator.classList.add('active');
    indicator.title = state.systemPrompt.substring(0, 100);
  } else {
    indicator.classList.remove('active');
    indicator.title = 'システムプロンプト未設定';
  }
}

function updateTokenCount() {
  const el = document.getElementById('tokenCount');
  if (!state.currentConvId || !state.conversations[state.currentConvId]) {
    el.textContent = '';
    return;
  }
  const conv = state.conversations[state.currentConvId];
  const charCount = conv.messages.reduce((sum, m) => {
    const text = typeof m.content === 'string' ? m.content :
      m.content.filter(b => b.type === 'text').map(b => b.text).join('');
    return sum + text.length;
  }, 0);
  // Rough token estimate (Japanese ~1.5 chars per token)
  const tokenEst = Math.round(charCount / 1.5);
  el.textContent = `≈${tokenEst.toLocaleString()} tokens`;
}

// ===================== Settings =====================
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('systemPromptInput').value = state.systemPrompt;
  document.getElementById('maxTokensInput').value = state.maxTokens;
  document.getElementById('temperatureInput').value = state.temperature;
  document.getElementById('streamingInput').value = state.streaming ? 'true' : 'false';
  document.getElementById('testResult').style.display = 'none';
  document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}

function saveSettings() {
  state.apiKey = document.getElementById('apiKeyInput').value.trim();
  state.systemPrompt = document.getElementById('systemPromptInput').value.trim();
  state.maxTokens = parseInt(document.getElementById('maxTokensInput').value) || 4096;
  state.temperature = parseFloat(document.getElementById('temperatureInput').value) || 1;
  state.streaming = document.getElementById('streamingInput').value === 'true';
  saveState();
  updateApiStatus();
  updateSysPromptIndicator();
  closeSettings();
}

async function testApiConnection() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const resultDiv = document.getElementById('testResult');
  const testBtn = document.getElementById('testBtn');

  if (!apiKey) {
    resultDiv.style.display = 'block';
    resultDiv.style.background = 'rgba(255,71,87,0.1)';
    resultDiv.style.color = '#ff4757';
    resultDiv.textContent = '❌ APIキーを入力してください';
    return;
  }

  testBtn.disabled = true;
  testBtn.textContent = '⏳ テスト中...';
  resultDiv.style.display = 'block';
  resultDiv.style.background = 'rgba(255,165,2,0.1)';
  resultDiv.style.color = '#ffa502';
  resultDiv.textContent = '⏳ APIに接続中...';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 50,
        messages: [{ role: 'user', content: 'Say OK' }]
      })
    });

    const data = await response.json();

    if (response.ok) {
      const reply = data.content?.[0]?.text || '(応答あり)';
      resultDiv.style.background = 'rgba(0,212,170,0.1)';
      resultDiv.style.color = '#00d4aa';
      resultDiv.textContent = '✅ 接続成功！応答: ' + reply.substring(0, 50);
    } else {
      resultDiv.style.background = 'rgba(255,71,87,0.1)';
      resultDiv.style.color = '#ff4757';
      const errMsg = data.error?.message || `Status: ${response.status}`;
      resultDiv.textContent = '❌ エラー: ' + errMsg;
    }
  } catch (err) {
    resultDiv.style.background = 'rgba(255,71,87,0.1)';
    resultDiv.style.color = '#ff4757';
    resultDiv.textContent = '❌ 接続失敗: ' + err.message + '\n(CORS/ネットワークエラーの可能性)';
  }

  testBtn.disabled = false;
  testBtn.textContent = '🔌 接続テスト';
}

// ===================== Start =====================
init();
</script>
